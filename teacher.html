<!DOCTYPE html><html lang=th><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ห้องเรียนของคุณครู · วิทยาศาสตร์ ป.1</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel=stylesheet><style>
body{margin:0;background:linear-gradient(#bfe3ff,#eef6ff 55%,#d4f3c8) fixed;min-height:100vh;font-family:Mali,Sarabun,sans-serif;color:#223}#a{max-width:900px;margin:auto;padding:16px}.card{background:rgba(255,255,255,.95);border-radius:18px;padding:16px;margin:10px 0}.b{padding:10px 16px;font:inherit;border:0;border-radius:12px;background:#4A90D9;color:#fff;margin:4px 2px}.b.g{background:#8895a5}.b.r{background:#e17055}input{padding:10px;font:inherit;border-radius:10px;border:2px solid #cfe0f5;margin:3px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #dde;padding:6px;text-align:left}.cd{font:700 18px monospace;letter-spacing:2px}.w{overflow-x:auto}@media print{.np{display:none}}
</style></head><body><div id=a></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
const FC={apiKey:"AIzaSyB91biFPmWJJj-TWkqj4LGWCr_UY7FdMhg",authDomain:"science-p1.firebaseapp.com",projectId:"science-p1",storageBucket:"science-p1.firebasestorage.app",messagingSenderId:"866283047084",appId:"1:866283047084:web:eb31d746992355592d3709"};
const FORM='https://forms.gle/fQLsTYmvRN21TnTC9',AD='',OW='นางสารธนพร สุรเกียรติขจร',AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',CN=['การเรียนรู้สิ่งต่าง ๆ รอบตัว','ตัวเรา สัตว์และพืช','สิ่งต่าง ๆ รอบตัว','โลกและท้องฟ้า'];
firebase.initializeApp(FC);const au=firebase.auth(),db=firebase.firestore(),A=document.getElementById('a'),$=i=>document.getElementById(i),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let me,rn=1,RO=[],PR={};
function intro(m){A.innerHTML=`<div class=card><h1>🏫 ห้องเรียนของคุณครู · วิทยาศาสตร์ ป.1</h1><p>สวัสดีค่ะ คุณครู 👋<br>แอปนี้เป็นโครงการของ <b>${OW}</b> ทำขึ้นเพื่อให้นักเรียนชั้น ป.1 ได้เรียนวิทยาศาสตร์ผ่านวิดีโอ เกม และแบบทดสอบ</p><p><b>อยากใช้กับนักเรียนของคุณครู?</b><br>กรอกแบบฟอร์มขอสิทธิ์ (ใช้เวลาไม่กี่นาที) โดยแจ้งชื่อ โรงเรียน จำนวนห้องและนักเรียน และอีเมล Google ที่จะใช้เข้าสู่ระบบ เมื่อเพิ่มสิทธิ์เรียบร้อยจะแจ้งกลับ แล้วคุณครูกลับมากดเข้าสู่ระบบด้านล่างได้เลยค่ะ<br><a href="${FORM}" target=_blank rel=noopener><button class=b>📝 กรอกแบบฟอร์มขอสิทธิ์</button></a></p><p><b>ขอบอกกันตรงๆ นะคะ 💬</b><br>โครงการนี้ไม่มีค่าใช้จ่าย จึงใช้ระบบฟรีที่มีโควตาต่อวันจำกัด ถ้ามีคนใช้พร้อมกันจำนวนมาก แอปอาจ <b>ช้า ใช้ไม่ได้ชั่วคราว หรือบันทึกคะแนนไม่ทัน</b> (โควตาจะกลับมาใหม่ในวันถัดไป) หากเจอปัญหา รบกวนลองใหม่ภายหลังนะคะ ขอบคุณที่ใช้งานและเข้าใจค่ะ 🙏</p>${m||''}${me?'<button class="b g" onclick="au.signOut()">ออกจากระบบ</button>':'<button class=b onclick="au.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(\'เข้าสู่ระบบไม่สำเร็จ: \'+e.code))">เข้าสู่ระบบด้วย Google</button>'}</div>`}
au.onAuthStateChanged(async u=>{me=u;if(!u)return intro();let d;try{d=await db.collection('teachers').doc(u.email).get()}catch(e){}if(!d||!d.exists)return intro(`<p style="color:#d63031">ขออภัยค่ะ อีเมล <b>${E(u.email)}</b> ยังไม่ได้รับสิทธิ์ใช้งานในฐานะครู กรุณากรอกแบบฟอร์มขอสิทธิ์ตามด้านบน (ใช้อีเมลนี้) แล้วรอข้อความตอบกลับนะคะ</p>`);main()});
function main(){A.innerHTML=`<div class="card np"><b>${E(me.displayName||me.email)}</b> <button class="b g" onclick="au.signOut()">ออกจากระบบ</button> ห้อง: <button class=b onclick="room(1)">ห้อง 1</button><button class=b onclick="room(2)">ห้อง 2</button></div><div id=rm></div>`;room(1)}
async function room(n){rn=n;const rid=me.uid+'_'+n,R=db.collection('rooms').doc(rid);$('rm').textContent='กำลังโหลด…';try{const[r,s,p]=await Promise.all([R.get(),R.collection('roster').get(),db.collection('progress').where('owner','==',me.uid).where('room','==',rid).get()]);RO=s.docs.map(d=>({seat:d.id,...d.data()})).sort((a,b)=>a.seat-b.seat);PR={};p.docs.forEach(d=>PR[d.id]=d.data());draw(r.exists?r.data().name:'ห้อง '+n)}catch(e){$('rm').textContent='โหลดไม่สำเร็จ: '+e.code}}
function cell(k){if(!k)return'–';return`ก${k.pre!=null?'✓':'–'} ว${k.vd?'✓':'–'} ส${k.sd?'✓':'–'} ท${k.rv?'✓':'–'} ผ${k.n?(k.ok?'✓':'✗')+k.best+'%':'–'}`}
function draw(nm){$('rm').innerHTML=`<div class="card np"><b>ห้อง ${rn}</b> ชื่อห้อง: <input id=rnm value="${E(nm)}" maxlength=30><p><b>เพิ่มนักเรียน</b> (${RO.length}/25 คน) กรอกช่องใดก็ได้ ไม่ต้องครบ แต่ต้องมีอย่างน้อย 1 ช่อง<br><small>ชื่อเล่นจะแสดงบนหน้าจอเด็กระหว่างเล่น แนะนำให้กรอกทุกคน ส่วนชื่อจริงและนามสกุลกรอกเท่าที่ต้องใช้แยกแยะนักเรียน ชื่อที่กรอกแสดงให้เฉพาะคุณครูเจ้าของห้องเท่านั้น</small><br><input id=nk placeholder=ชื่อเล่น><input id=fn placeholder=ชื่อจริง><input id=ln placeholder=นามสกุล><button class=b id=go onclick="add()">สร้างรหัส</button></p><button class=b onclick="room(${rn})">🔄 โหลดผลล่าสุด</button><button class="b g" onclick="print()">🖨️ พิมพ์</button><br><small>ก=ก่อนเรียน ว=ดูวิดีโอจบ ส=ดูสไลด์ครบ ท=ทบทวนครบ ผ=ผลหลังเรียน (✓ผ่าน ✗ไม่ผ่าน และคะแนนสูงสุด)</small></div><div class="card w"><table><tr><th>ที่<th>ชื่อ<th>รหัส<th>เวลา(นาที)${CN.map((c,i)=>`<th>ด่าน ${i+1}<br><small>${c}</small>`).join('')}<th class=np></tr>`+RO.map(x=>{const p=PR[x.code]||{};return`<tr><td>${x.seat}<td>${E([x.nick,x.first,x.last].filter(Boolean).join(' '))}<td class=cd>${x.code}<td>${Math.round((p.sec||0)/60)}${CN.map((_,i)=>`<td>${cell((p.c||{})[i])}`).join('')}<td class=np><button class="b g" onclick="rs('${x.code}')">รีเซ็ต</button><button class="b r" onclick="dl('${x.code}','${x.seat}')">ลบ</button>`}).join('')+'</table></div>'}
async function add(){const v=['nk','fn','ln'].map(x=>$(x).value.trim()),nm=v[0]||v[1]||v[2],rid=me.uid+'_'+rn;if(!nm)return alert('กรอกอย่างน้อย 1 ช่อง');const u=RO.map(x=>x.seat);let seat=0;for(let i=1;i<=25;i++)if(!u.includes(''+i)){seat=i;break}if(!seat)return alert('ห้องนี้ครบ 25 คนแล้ว');const g=$('go');g.disabled=true;g.textContent='กำลังสร้างรหัส…';try{let code='';for(let t=0;t<6&&!code;t++){const c=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>AL[b%32]).join('');if(!(await db.collection('progress').doc(c).get()).exists)code=c}if(!code)throw{code:'no-code'};const b=db.batch(),R=db.collection('rooms').doc(rid);b.set(R,{owner:me.uid,email:me.email,name:$('rnm').value.trim()||'ห้อง '+rn},{merge:true});b.set(R.collection('roster').doc(''+seat),{nick:v[0],first:v[1],last:v[2],code});b.set(db.collection('progress').doc(code),{owner:me.uid,room:rid,seat,nm,sec:0,c:{}});await b.commit();room(rn)}catch(e){alert('สร้างไม่สำเร็จ: '+(e.code||e));g.disabled=false;g.textContent='สร้างรหัส'}}
async function rs(c){if(!confirm('รีเซ็ตคะแนนและเวลาเรียนของนักเรียนคนนี้ใช่ไหม? ย้อนกลับไม่ได้'))return;try{await db.collection('progress').doc(c).update({sec:0,c:{}});room(rn)}catch(e){alert('ไม่สำเร็จ: '+e.code)}}
async function dl(c,s){if(!confirm('ลบนักเรียนคนนี้และคะแนนทั้งหมดใช่ไหม? ย้อนกลับไม่ได้'))return;try{const b=db.batch();b.delete(db.collection('progress').doc(c));b.delete(db.collection('rooms').doc(me.uid+'_'+rn).collection('roster').doc(s));await b.commit();room(rn)}catch(e){alert('ไม่สำเร็จ: '+e.code)}}
</script></body></html>
