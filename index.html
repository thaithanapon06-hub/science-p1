<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>วิทยาศาสตร์ ป.1</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f5c63">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2faf7;--ink:#16302b;--pri:#0f5c63;--sun:#ffc93c;--mute:#c9d6d2}
@media(prefers-color-scheme:dark){:root{--bg:#10241f;--ink:#e8f5f1;--pri:#5cc6cf;--mute:#3a4f4a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 Mali,"Noto Sans Thai",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:12px 0 40px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}
a{color:var(--pri)}.hero{text-align:center;padding-top:14vh}.hero h1{font-size:2.4rem;margin:.2em 0}.sun{width:84px;height:84px;border-radius:50%;background:var(--sun);margin:0 auto}
.btn{display:block;width:100%;margin:12px 0;padding:14px;border:0;border-radius:16px;background:var(--pri);color:#fff;font:inherit;font-weight:700;min-height:52px}
.btn.alt{background:transparent;color:var(--ink);border:3px solid var(--pri);text-align:left}.btn:disabled{opacity:.45}
.chs{list-style:none;padding:0}.ch{display:flex;gap:14px;align-items:center;width:100%;margin:8px 0;padding:14px;border:3px solid var(--pri);border-radius:18px;background:transparent;color:var(--ink);font:inherit;text-align:left}
.ch b{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--sun);color:#16302b}.ch.lock{border-color:var(--mute);opacity:.6}.ch.lock b{background:var(--mute)}
fieldset{border:0;padding:0;margin:20px 0}legend{font-weight:700;margin-bottom:6px}.opt{display:flex;gap:10px;align-items:center;padding:12px;margin:6px 0;border:2px solid var(--mute);border-radius:14px}.opt input{width:22px;height:22px}
.note{opacity:.75;font-size:.9rem}.vid{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}.vid iframe{width:100%;height:100%}.h5p{margin:14px 0;padding:24px;border:2px dashed var(--mute);border-radius:14px;text-align:center}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
</style></head><body><main id="app"></main><script type="module" src="app.js"></script></body></html>
