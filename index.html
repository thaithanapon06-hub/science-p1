A.querySelectorAll('.o').forEach(b=>b.onclick=()=>{const r=o[b.dataset.j][1];A.querySelectorAll('.o').forEach(x=>x.disabled=true);b.classList.add(r?'ok':'no');A.firstChild.insertAdjacentHTML('beforeend',`<p>${r?'🎉 ถูกต้อง!':'🤔 ยังไม่ใช่นะ ไว้ลองใหม่'}</p><button class=b id=n>ต่อไป ▶</button>`);document.getElementById('n').onclick=()=>cb(r)})}
function go(i){cur=i;C(i).pre==null?pre(i):vid(i)}
function pre(i,n=0,c=0){const q=CH[i].pre;if(n>=q.length){C(i).pre=Math.round(c/q.length*100);sv();return vid(i)}ask(q[n],`ก่อนเรียน ${n+1}/${q.length}`,r=>pre(i,n+1,c+r))}
function vid(i){const c=CH[i],k=C(i),g=x=>document.getElementById(x);if(!c.v)return les(i);const w=Math.min(innerWidth-70,420);A.innerHTML=`<div class=card><small>วิดีโอบทเรียน (สสวท. Project 14)</small><iframe id=yt width=${w} height=${Math.round(w*9/16)} src="https://www.youtube.com/embed/${c.v}?rel=0&enablejsapi=1" allow="encrypted-media;fullscreen" allowfullscreen style="border:0;max-width:100%"></iframe><p id=vm>🔒 ดูวิดีโอให้จบก่อนนะ</p><p><a href="https://youtu.be/${c.v}" target=_blank>เปิดดูใน YouTube</a></p><button class=b id=vn disabled onclick="les(${i})">ไปต่อ ▶</button></div>`;
const ok=()=>{if(!g('vn'))return;g('vm').textContent='🎉 ดูจบแล้ว!';g('vn').disabled=false;if(!k.vd){k.vd=1;sv()}},mk=()=>new YT.Player('yt',{events:{onStateChange:e=>e.data==0&&ok()}});
if(window.YT&&YT.Player)mk();else{window.onYouTubeIframeAPIReady=mk;if(!window.yts){yts=1;const x=document.createElement('script');x.src='https://www.youtube.com/iframe_api';document.head.append(x)}}
setTimeout(()=>{if(g('vn')&&g('vn').disabled&&!(window.YT&&YT.Player))ok()},8000);if(k.vd)ok()}
function les(i,s=0){const L=CH[i].s;if(s>=L.length)return pr(i);const x=L[s];A.innerHTML=`<div class=card><small>บทเรียน ${s+1}/${L.length}</small><div class=em>${x[0]}</div><h2>${x[1]}</h2><p>${x[2]}</p><button class="b g" onclick="speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('${x[1]} ${x[2]}');u.lang='th-TH';speechSynthesis.speak(u)">🔊 ฟังเสียง</button><button class=b onclick="speechSynthesis.cancel();les(${i},${s+1})">ต่อไป ▶</button></div>`}
function pr(i,Q){const k=C(i);Q=Q||CH[i].pr.map((_,j)=>j).filter(j=>!k.ps[j]);if(!Q.length)return po(i);ask(CH[i].pr[Q[0]],`ทบทวน เหลืออีก ${Q.length} ข้อ`,r=>{if(r){k.ps[Q[0]]=1;Q.shift()}else Q.push(Q.shift());sv();pr(i,Q)})}
function po(i,n=0,c=0){const q=CH[i].post,k=C(i);if(n>=q.length){const p=Math.round(c/q.length*100);k.last=p;k.best=Math.max(k.best||0,p);k.n=(k.n||0)+1;if(p>=60)k.ok=1;sv();A.innerHTML=`<div class=card><div class=em>${p>=60?'🏆':'💪'}</div><h2>ได้ ${p}% (${c}/${q.length})</h2><p>${p>=60?'ผ่านแล้ว! ปลดล็อกบทถัดไป':'ต้องได้อย่างน้อย 60% ไปเรียนอีกรอบนะ'}</p><button class=b onclick="${p>=60?'home()':`vid(${i})`}">${p>=60?'กลับหน้าบทเรียน':'ไปเรียนอีกครั้ง'}</button></div>`;return}ask(q[n],`ทดสอบหลังเรียน ${n+1}/${q.length}`,r=>po(i,n+1,c+r))}
setInterval(()=>{if(U&&!document.hidden){P.sec++;if(cur!=null)C(cur).sec=(C(cur).sec||0)+1;if(++t%30==0)sv()}},1000);
addEventListener('visibilitychange',()=>document.hidden&&U&&sv());
(async()=>{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js');
if(FC){for(const f of['app','auth','firestore'])await new Promise(r=>{const s=document.createElement('script');s.src=`https://www.gstatic.com/firebasejs/10.12.2/firebase-${f}-compat.js`;s.onload=r;document.head.append(s)});firebase.initializeApp(FC);db=firebase.firestore();firebase.auth().onAuthStateChanged(async u=>{if(u){U={uid:u.uid,name:u.displayName||'ผู้เรียน'};await ld();gate()}else login()})}
else if(localStorage.sci1_demo){U=JSON.parse(localStorage.sci1_demo);await ld();gate()}else login()})();
</script></body></html>
